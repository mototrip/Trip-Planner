<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101713"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>MotoTrip</title></head><body><main><header><small>RIDE MORE · EXPLORE FURTHER</small><h1> MOTO<span>TRIP</span></h1><p>YOUR PERSONAL RIDE COMPANION</p></header><nav><button data-tab="plan">Planner</button><button data-tab="gear">Gear</button><button data-tab="trips">My trips</button></nav><section id="plan"><div class="hero"><small> TRIP ESTIMATE</small><h2 id="total">₹0</h2><div id="stats" class="grid"></div></div><form id="planner"><h2>Plan your ride</h2><label>Trip name<input name="name" required value="Mountain Adventure"></label><div class="grid"><label>From<input name="from" required value="Delhi"></label><label>To<input name="to" required value="Manali"></label></div><a id="map" target="_blank" rel="noopener">Open Google Maps ↗</a><div class="grid"><label>One-way km<input name="distance" type="number" min="1" required value="540"></label><label>Days<input name="days" type="number" min="1" required value="4"></label></div><label class="check"><input name="round" type="checkbox" checked> Return journey</label><h2>Fuel & expenses</h2><div class="grid"><label>Mileage (km/L)<input name="mileage" type="number" min="1" step="any" required value="30"></label><label>Petrol ₹/L<input name="price" type="number" min="0" step="any" required value="95"></label><label>Average km/h<input name="speed" type="number" min="1" required value="50"></label><label>Hotel ₹/night<input name="hotel" type="number" min="0" required value="1000"></label><label>Food ₹/day<input name="food" type="number" min="0" required value="600"></label><label>Other ₹<input name="extra" type="number" min="0" required value="1000"></label></div><div id="breakdown"></div><button class="primary">Save trip</button></form></section><section id="gear" hidden><h2>Ride preparation</h2><progress id="progress" max="12"></progress><p id="count"></p><div id="checklist"></div><button id="reset">Reset checklist</button></section><section id="trips" hidden><h2>Saved adventures</h2><div id="history"></div><button id="export">Export backup (JSON)</button><label>Restore backup<input id="import" type="file" accept="application/json,.json"></label></section><p id="notice" role="status"></p><footer>Estimates only • Map routes require internet • Sample inputs are editable</footer></main><script src="app.js"></script></body></html>
