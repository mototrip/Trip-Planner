name: MotoTrip Signed Play Candidate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-bundle:
    name: Generate upload-key signed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Restore private upload keystore from GitHub Secrets
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.MOTOTRIP_UPLOAD_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.MOTOTRIP_UPLOAD_STORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.MOTOTRIP_UPLOAD_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.MOTOTRIP_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$SECRET_KEYSTORE_B64" "$SECRET_STORE_PASSWORD" "$SECRET_ALIAS" "$SECRET_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Missing required MotoTrip upload-key GitHub Actions secret; see android-app/TWA_MIGRATION_HINGLISH.md"
              exit 1
            fi
          done
          printf '%s' "$SECRET_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mototrip-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/mototrip-upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/mototrip-upload-key.jks" -storepass "$SECRET_STORE_PASSWORD" -alias "$SECRET_ALIAS" >/dev/null
          echo "MOTOTRIP_SIGNING_STORE_FILE=$RUNNER_TEMP/mototrip-upload-key.jks" >> "$GITHUB_ENV"

      - name: Assemble upload-key signed bundle
        working-directory: android-app
        env:
          MOTOTRIP_SIGNING_STORE_PASSWORD: ${{ secrets.MOTOTRIP_UPLOAD_STORE_PASSWORD }}
          MOTOTRIP_SIGNING_KEY_ALIAS: ${{ secrets.MOTOTRIP_UPLOAD_KEY_ALIAS }}
          MOTOTRIP_SIGNING_KEY_PASSWORD: ${{ secrets.MOTOTRIP_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:bundleRelease --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q 'jar verified'

      - name: Create public certificate fingerprint report
        shell: bash
        env:
          SECRET_STORE_PASSWORD: ${{ secrets.MOTOTRIP_UPLOAD_STORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.MOTOTRIP_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Certificate of release upload key (not necessarily the Google Play app-signing certificate)" > "$RUNNER_TEMP/mototrip-signing-report.txt"
          keytool -list -v -keystore "$RUNNER_TEMP/mototrip-upload-key.jks" -storepass "$SECRET_STORE_PASSWORD" -alias "$SECRET_ALIAS" |
            grep -E 'Alias name:|SHA256:' >> "$RUNNER_TEMP/mototrip-signing-report.txt"

      - name: Upload signed AAB CANDIDATE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoTrip-UploadKey-SIGNED-Candidate-NotYetPublished
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload public certificate fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoTrip-Public-Upload-Certificate-Fingerprint
          path: ${{ runner.temp }}/mototrip-signing-report.txt
          if-no-files-found: error
      - name: Erase the temporary private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mototrip-upload-key.jks"
