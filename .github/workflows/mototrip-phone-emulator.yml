name: MotoTrip Android Phone Emulator QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'tests/android-emulator-smoke.py'
      - '.github/workflows/mototrip-phone-emulator.yml'

permissions:
  contents: read

jobs:
  pixel-phone:
    name: Pixel 7 Android 15 phone emulator (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout MotoTrip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install compile SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build latest Android APK
        run: |
          set -euo pipefail
          bash android-app/gradlew -p android-app :app:assembleDebug --no-daemon --stacktrace
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable virtual phone acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Launch Pixel 7 emulator and test actual APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tests/android-emulator-smoke.py

      - name: Upload phone screenshots, UI and crash logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoTrip-Pixel7-Android15-Emulator-Results
          path: android-emulator-results/
          if-no-files-found: warn
