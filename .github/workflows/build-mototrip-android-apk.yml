            unzip -oq "$RUNNER_TEMP/mototrip-android-source.zip" -d .
          fi
          if [[ ! -f android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png ]]; then
            if [[ -f icon-192.png ]]; then
              ICON_SOURCE='icon-192.png'
            elif [[ -f icon-512.png ]]; then
              ICON_SOURCE='icon-512.png'
            elif [[ -f ic_launcher.png ]]; then
              ICON_SOURCE='ic_launcher.png'
            else
              echo 'ERROR: icon-192.png and icon-512.png not found at repository root.'
              exit 1
            fi
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "android-app/app/src/main/res/mipmap-$density"
              cp "$ICON_SOURCE" "android-app/app/src/main/res/mipmap-$density/ic_launcher.png"
            done
          fi
          echo 'Android folder restored successfully.'
          find android-app -type f | sort | head -30

      - name: Compile installable Android TEST APK
        run: gradle -p android-app :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK download
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk MotoTrip-Android-TEST.apk
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoTrip-Android-TEST-APK
          path: MotoTrip-Android-TEST.apk
          if-no-files-found: error

      # Optional signed build. The private key must only be stored as GitHub Secrets.
      - name: Decode private signing key
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SIGNING_B64: ${{ secrets.MOTOTRIP_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASS: ${{ secrets.MOTOTRIP_SIGNING_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_B64" && -n "$SIGNING_PASS" ]]; then
            printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/mototrip-signing.p12"
            echo "MOTOTRIP_RELEASE_KEYSTORE=$RUNNER_TEMP/mototrip-signing.p12" >> "$GITHUB_ENV"
            echo 'HAS_RELEASE_KEY=true' >> "$GITHUB_ENV"
          else
            echo 'HAS_RELEASE_KEY=false' >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          MOTOTRIP_RELEASE_PASSWORD: ${{ secrets.MOTOTRIP_SIGNING_PASSWORD }}
        run: |
          gradle -p android-app :app:assembleRelease --no-daemon --stacktrace
          cp android-app/app/build/outputs/apk/release/app-release.apk MotoTrip-Android.apk
      - name: Publish signed APK for direct installation
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view mototrip-android >/dev/null 2>&1; then
            gh release upload mototrip-android MotoTrip-Android.apk --clobber
          else
            gh release create mototrip-android MotoTrip-Android.apk \
              --title 'MotoTrip Android (Direct Install)' \
              --notes 'Signed MotoTrip Android APK from official repository.'
          fi
