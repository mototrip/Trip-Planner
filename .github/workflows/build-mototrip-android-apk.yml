name: Build MotoTrip Android TWA Preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-mototrip-android-apk.yml'

permissions:
  contents: read

jobs:
  build-twa-preview:
    name: Build side-by-side TWA preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate migration guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'com.mototrip.app.twa'" android-app/app/build.gradle
          grep -Fq 'FALLBACK_STRATEGY' android-app/app/src/main/AndroidManifest.xml
          ! grep -R -E 'setJavaScriptEnabled|android.webkit.WebView' android-app/app/src/main/java
          test -s android-app/gradle/wrapper/gradle-wrapper.jar
      - name: Build preview APK
        working-directory: android-app
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload TEST APK (not a signed release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoTrip-TWA-SideBySide-Preview-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
