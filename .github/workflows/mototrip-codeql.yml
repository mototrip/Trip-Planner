name: MotoTrip CodeQL - Android Build Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: mototrip-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-java:
    name: Android Java - compiled scan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check Android project path
        shell: bash
        run: |
          set -euo pipefail
          test -f android-app/settings.gradle
          test -f android-app/build.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/java/com/mototrip/app/MainActivity.java
          echo 'Building Android source in android-app/ (not the legacy root Java copy).'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Build MotoTrip Android for CodeQL
        shell: bash
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace --rerun-tasks
      - name: Analyze Android Java
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  web-js:
    name: Web JavaScript - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  github-actions:
    name: GitHub Actions - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
