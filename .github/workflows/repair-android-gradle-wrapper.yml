name: Repair MotoTrip Android Gradle Wrapper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-android-gradle-wrapper.yml'

permissions:
  contents: write

jobs:
  repair-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create official Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f android-app/settings.gradle
          gradle -p android-app wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          test -s android-app/gradlew
          test -s android-app/gradlew.bat
          test -s android-app/gradle/wrapper/gradle-wrapper.jar
          test -s android-app/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'gradle-8.11.1-bin.zip' android-app/gradle/wrapper/gradle-wrapper.properties
      - name: Commit generated wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android-app/gradlew android-app/gradlew.bat android-app/gradle/wrapper/gradle-wrapper.jar android-app/gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo 'Gradle wrapper already present and up to date.'
            exit 0
          fi
          git commit -m 'Add official Gradle 8.11.1 wrapper for Android project'
          git push origin HEAD:main
