plugins { id 'com.android.application' }

android {
    namespace 'com.mototrip.app'
    compileSdk 35

    defaultConfig {
        // Distinct preview package: preserves the already installed WebView
        // app (com.mototrip.app) and all its on-device localStorage/IndexedDB.
        applicationId 'com.mototrip.app.twa'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0-preview'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // No signed release is automatically published for the preview.
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
